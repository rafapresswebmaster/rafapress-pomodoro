name: Deploy via SCP

on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy production
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    env:
      VITE_GA_ID: ${{ vars.VITE_GA_ID }}
      VITE_APP_URL: ${{ vars.VITE_APP_URL }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify GA4 page-view tag
        shell: bash
        run: |
          test "$(grep -Fxc '        <script async src="https://www.googletagmanager.com/gtag/js?id=G-4DYBDNVCWK"></script>' index.html)" -eq 1
          test "$(grep -Fxc "            gtag('config', 'G-4DYBDNVCWK');" index.html)" -eq 1

      - name: Run current release regression gate
        run: >-
          node --test --test-isolation=none
          tests/current_release.test.js
          tests/balance36_ux.test.js
          tests/bard_druid.test.js
          tests/death_stabilization.test.js
          tests/item_persistence.test.js
          tests/major_overhaul.test.js
          tests/mobile_usability.test.js
          tests/quest_launch_regression.test.js
          tests/single_slot_save.test.js
          tests/visual_battle_stage.test.js
          tests/world_balance_validation.test.js
          tests/world_rebalance.test.js

      - name: Remove legacy image formats
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ vars.SCP_HOST }}
          port: ${{ vars.SCP_PORT }}
          username: ${{ vars.SCP_USERNAME }}
          key: ${{ secrets.PRIVATE_DEPLOY_KEY }}
          script: |
            find "${{ vars.SCP_DIRECTORY_APP }}" -type f \( -iname '*.png' -o -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.gif' -o -iname '*.bmp' \) -delete

      - name: Deploy application files
        uses: appleboy/scp-action@v1
        with:
          host: ${{ vars.SCP_HOST }}
          port: ${{ vars.SCP_PORT }}
          username: ${{ vars.SCP_USERNAME }}
          key: ${{ secrets.PRIVATE_DEPLOY_KEY }}
          source: "audio,css,data,effects,fonts,icon,img,js,movies,game.rmmzproject,index.html,package.json"
          target: ${{ vars.SCP_DIRECTORY_APP }}
          overwrite: true
