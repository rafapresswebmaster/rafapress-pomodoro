name: Deploy via SCP

on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy production
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    env:
      VITE_GA_ID: ${{ vars.VITE_GA_ID }}
      VITE_APP_URL: ${{ vars.VITE_APP_URL }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Remove legacy image formats
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ vars.SCP_HOST }}
          port: ${{ vars.SCP_PORT }}
          username: ${{ vars.SCP_USERNAME }}
          key: ${{ secrets.PRIVATE_DEPLOY_KEY }}
          script: |
            find "${{ vars.SCP_DIRECTORY_APP }}" -type f \( -iname '*.png' -o -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.gif' -o -iname '*.bmp' \) -delete

      - name: Deploy application files
        uses: appleboy/scp-action@v1
        with:
          host: ${{ vars.SCP_HOST }}
          port: ${{ vars.SCP_PORT }}
          username: ${{ vars.SCP_USERNAME }}
          key: ${{ secrets.PRIVATE_DEPLOY_KEY }}
          source: "audio,css,data,effects,fonts,icon,img,js,movies,game.rmmzproject,index.html,package.json"
          target: ${{ vars.SCP_DIRECTORY_APP }}
          overwrite: true
