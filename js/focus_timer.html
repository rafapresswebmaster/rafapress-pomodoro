<!doctype html><html><head><meta charset="utf-8"><title>RPG Manager Focus Timer</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:232px;height:96px;overflow:hidden;background:#243969;color:#fff0c8;font-family:Trebuchet MS,sans-serif}main{height:96px;display:flex;align-items:center;border:2px solid #e5c374;border-radius:12px;-webkit-app-region:drag}svg{width:76px;height:76px;flex:none}.focus-time{display:block;font:bold 34px monospace}.focus-state{display:block;font-size:14px}button{position:absolute;right:4px;top:1px;background:none;color:#fff0c8;border:0;font-size:18px;cursor:pointer;-webkit-app-region:no-drag}
</style></head><body><main id="readout" role="timer"><svg viewBox="0 0 80 80" aria-hidden="true"><circle cx="40" cy="40" r="33" fill="#fff0c8" stroke="#cdb474" stroke-width="4"/><circle class="focus-ring" cx="40" cy="40" r="28" fill="none" stroke="#386baf" stroke-width="8" stroke-linecap="round" transform="rotate(-90 40 40)"/><path d="M40 9v7M71 40h-7M40 71v-7M9 40h7" stroke="#634c30" stroke-width="2"/></svg><div><strong class="focus-time">--:--</strong><span class="focus-state">Ready</span></div><button type="button" aria-label="Hide floating timer">X</button></main>
<script src="focus_companion.js"></script><script src="focus_timer_widget.js"></script></body></html>
