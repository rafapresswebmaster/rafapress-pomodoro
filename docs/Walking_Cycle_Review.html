<!doctype html><meta charset="utf-8"><title>Walking cycle review</title>
<style>body{background:#202b41;color:#ffedcc;font:17px system-ui;margin:24px}button,select{font:inherit;padding:8px;background:#354c70;color:inherit;border:1px solid #c4aa65;border-radius:4px}main{display:grid;grid-template-columns:repeat(3,minmax(220px,1fr));gap:16px}article{background:#293c54;border-radius:8px;text-align:center}canvas{max-width:100%;image-rendering:pixelated}label{margin:12px}h1{font-size:24px}@media(max-width:750px){main{grid-template-columns:repeat(2,1fr)}}</style>
<h1>Walking cycle review</h1><p>Alternating contact poses with a stable head and ground position. Uses the game's walking renderer.</p>
<button id="play">Pause</button><label>Portrait variant <select id="variant"></select></label><label>Facing <select id="direction"><option value="1">Left</option><option value="2">Right</option></select></label><label>Speed <select id="speed"><option value="1">Normal</option><option value="0.5">Half speed</option></select></label><p id="phase"></p><main></main>
<script src="../js/plugins/RPGManagerBattleStage.js"></script><script>
const classes=['barbarian','knight','cleric','rogue','ranger','mage'],images={},canvases={},v=document.getElementById('variant');for(let i=0;i<16;i++)v.add(new Option(String(i+1),i));
for(const cls of classes){const a=document.createElement('article');a.innerHTML='<h2>'+cls[0].toUpperCase()+cls.slice(1)+'</h2><canvas width="320" height="240"></canvas>';document.querySelector('main').append(a);canvases[cls]=a.querySelector('canvas');for(const sex of ['male','female']){const im=new Image();im.src='../img/characters/RPGWalk_'+cls+'_'+sex+'_v5.webp';images[cls+sex]=im;}}
let playing=true,elapsed=0,last=performance.now();document.getElementById('play').onclick=()=>{playing=!playing;document.getElementById('play').textContent=playing?'Pause':'Play'};
function tick(now){if(playing)elapsed+=(now-last)*Number(document.getElementById('speed').value);last=now;const phase=Math.floor(elapsed/(1000/6))%4,pattern=[0,1,2,1][phase],variant=Number(v.value),sex=variant<8?'male':'female',i=variant%8,dir=Number(document.getElementById('direction').value);document.getElementById('phase').textContent=['Contact A','Passing','Opposite contact','Passing'][phase];for(const cls of classes){const c=canvases[cls].getContext('2d'),im=images[cls+sex];c.clearRect(0,0,320,240);c.fillStyle='#9bad88';c.fillRect(8,208,304,2);if(im.complete&&im.naturalWidth)RPGManagerBattleStage.drawWalkingFrame(c,im,(i%4*3+pattern)*64,(Math.floor(i/4)*4+dir)*64,64,64,64,32,192,192,pattern);}requestAnimationFrame(tick)}requestAnimationFrame(tick);
</script>
